name: web

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635a433ea3e258ad174747733 # v4.2.2

      - uses: actions/setup-node@a5ed7f8584ae25520f803ada85d1e3f09c0f6756 # v4.4.0
        with:
          node-version: "26.13.0"

      - name: emsdk 7.0.0 + WASM
        run: |
          set -euxo pipefail
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git checkout 1693ce7359fc9694f198694f902a2cc061239b86
          ./emsdk install 7.0.0
          ./emsdk activate 7.0.0
          source ./emsdk_env.sh
          emcc --version
          node --version
          cd ..
          cmake --preset wasm
          cmake --build --preset wasm
          mkdir -p web/public
          cp build/wasm/ekf.js build/wasm/ekf.wasm web/public/

      - name: Web CI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@26f96dfa40998ba7e7e505f57dec115195561f47 # v4.3.1
        with:
          name: web-dist
          path: web/dist

      - uses: actions/upload-artifact@26f96dfa40998ba7e7e505f57dec115195561f47 # v4.3.1
        with:
          name: demo-png
          path: docs/demo.png
