# SPDX-License-Identifier: Apache-2.0
name: core

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log toolchain
        run: |
          g++-13 --version
          cmake --version
          python3 --version

      - name: Configure and build
        run: |
          cmake --preset default
          cmake --build --preset default

      - name: Test
        run: ctest --preset default --output-on-failure

      - name: Monte Carlo label
        run: cd build/default && ctest -L mc --output-on-failure

      - name: No heap
        run: python3 tools/check_no_heap.py

      - name: Determinism O0 vs O2
        run: bash tools/o0_o2_parity.sh
