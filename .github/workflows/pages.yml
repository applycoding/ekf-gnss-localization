# SPDX-License-Identifier: Apache-2.0
name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [core, web]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        id: gate
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            async function lastSuccess(workflowFile) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                head_sha: sha,
                status: 'completed',
                per_page: 20
              });
              return runs.data.workflow_runs.find((r) => r.conclusion === 'success');
            }
            const coreRun = await lastSuccess('core.yml');
            const webRun = await lastSuccess('web.yml');
            const deployOk = Boolean(coreRun && webRun);
            core.setOutput('deploy_ok', deployOk ? 'true' : 'false');
            if (webRun) {
              core.setOutput('web_run_id', String(webRun.id));
            }

      - name: Require core and web green on same commit
        if: steps.gate.outputs.deploy_ok != 'true'
        run: |
          echo "core and web must both succeed on ${GITHUB_SHA}; skip Pages deploy"

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        if: steps.gate.outputs.deploy_ok == 'true'
        with:
          name: web-dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.gate.outputs.web_run_id }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.gate.outputs.deploy_ok == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.gate.outputs.deploy_ok == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.gate.outputs.deploy_ok == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v5.0.1
